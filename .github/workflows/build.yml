name: Windows EXE Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v0.2.21'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout version
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Check version tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$' -or $env:RELEASE_TAG -ne "v$version") {
            throw "The tag must match the package version: v$version"
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target/exe-only

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows exe
        run: pnpm tauri:win:exe

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: codex-switcher-windows-x64-${{ env.RELEASE_TAG }}
          path: src-tauri/target/exe-only/release/codex-switcher.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload exe to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseJson = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            if ($release.assets.name -contains 'codex-switcher.exe') {
              Write-Output 'This release already has an exe; the existing download is preserved.'
              exit 0
            }
          } else {
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --verify-tag --draft --title "$env:RELEASE_TAG — Windows Codex Quota & Credits Monitor" --notes 'Windows x64 Codex quota, Credits balance and floating widget. Windows Codex 额度与余额悬浮窗。Download codex-switcher.exe. Requires WebView2. Based on Lampese/codex-switcher.'
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the release draft.' }
          }
          gh release upload $env:RELEASE_TAG 'src-tauri/target/exe-only/release/codex-switcher.exe' --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the exe.' }
